<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">System Ledger evidence processing map</title>
  <desc id="desc">OpenAPI, AsyncAPI, SQL DDL, and a service manifest feed a local SQLite evidence graph. Explain, impact, path, doctor, and verify query that graph. Relationships are visibly classified as declared, source-derived, or inferred.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b82"/>
    </marker>
    <style>
      .canvas { fill: #f7f8fb; }
      .frame { fill: #ffffff; stroke: #d6dbe5; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #aab6c8; stroke-width: 1.5; }
      .ledger { fill: #edf3ff; stroke: #4b79c9; stroke-width: 2; }
      .query { fill: #f4f8f2; stroke: #638a58; stroke-width: 1.5; }
      .line { fill: none; stroke: #5d6b82; stroke-width: 2; marker-end: url(#arrow); }
      .declared { fill: none; stroke: #4b79c9; stroke-width: 2; marker-end: url(#arrow); }
      .source { fill: none; stroke: #8b6a32; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .inferred { fill: none; stroke: #638a58; stroke-width: 2; stroke-dasharray: 2 5; marker-end: url(#arrow); }
      .heading { font: 700 23px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #192235; }
      .label { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #243148; }
      .detail { font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #526176; }
      .tag { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #526176; }
    </style>
  </defs>
  <rect class="canvas" width="1200" height="560" rx="18"/>
  <text class="heading" x="48" y="62">Source evidence, kept inspectable</text>
  <text class="detail" x="48" y="88">Deterministic parsing and conservative graph construction happen locally.</text>

  <rect class="frame" x="48" y="130" width="244" height="308" rx="12"/>
  <text class="label" x="72" y="166">Inputs</text>
  <rect class="node" x="72" y="188" width="196" height="43" rx="7"/>
  <text class="label" x="88" y="215">OpenAPI 3</text>
  <rect class="node" x="72" y="244" width="196" height="43" rx="7"/>
  <text class="label" x="88" y="271">AsyncAPI 2 / 3</text>
  <rect class="node" x="72" y="300" width="196" height="43" rx="7"/>
  <text class="label" x="88" y="327">SQL CREATE TABLE</text>
  <rect class="node" x="72" y="356" width="196" height="58" rx="7"/>
  <text class="label" x="88" y="382">system-ledger.yaml</text>
  <text class="detail" x="88" y="402">service, owner, source</text>

  <path class="line" d="M292 265 H430"/>
  <text class="tag" x="322" y="246">parse + hash</text>
  <rect class="ledger" x="430" y="164" width="350" height="250" rx="12"/>
  <text class="label" x="456" y="202">Local SQLite evidence graph</text>
  <line x1="456" y1="219" x2="754" y2="219" stroke="#b8c5d9"/>
  <text class="detail" x="456" y="250">assets</text>
  <text class="detail" x="612" y="250">relationships</text>
  <text class="detail" x="456" y="278">sources</text>
  <text class="detail" x="612" y="278">evidence</text>
  <text class="detail" x="456" y="321">API / operation / schema / table</text>
  <text class="detail" x="456" y="346">channel / message / service</text>
  <path class="declared" d="M456 376 H533"/>
  <text class="tag" x="544" y="380">declared</text>
  <path class="source" d="M622 376 H699"/>
  <text class="tag" x="710" y="380">source-derived</text>
  <path class="inferred" d="M456 399 H533"/>
  <text class="tag" x="544" y="403">inferred</text>

  <path class="line" d="M780 289 H908"/>
  <text class="tag" x="804" y="270">query locally</text>
  <rect class="frame" x="908" y="130" width="244" height="308" rx="12"/>
  <text class="label" x="932" y="166">Answers</text>
  <rect class="query" x="932" y="188" width="196" height="38" rx="7"/>
  <text class="label" x="948" y="213">summary</text>
  <rect class="query" x="932" y="238" width="196" height="38" rx="7"/>
  <text class="label" x="948" y="263">explain / impact</text>
  <rect class="query" x="932" y="288" width="196" height="38" rx="7"/>
  <text class="label" x="948" y="313">path</text>
  <rect class="query" x="932" y="338" width="196" height="38" rx="7"/>
  <text class="label" x="948" y="363">doctor / verify</text>
  <text class="detail" x="932" y="410">owner + source locator</text>
  <text class="detail" x="932" y="430">in every reported link</text>
</svg>
